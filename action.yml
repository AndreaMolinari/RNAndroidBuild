name: React Native Android Build
description: Build a React Native Android App and Deploy it on the Play Store

author: Andrea Molinari

branding:
  color: purple
  icon: arrow-up-circle

inputs:
  package-name:
    description: Android app package name
    required: true
  KEYSTORE64:
    description: Android keystore encoded in base64
    required: true
  ANDROID_KEY_PASSWORD:
    description: Android keystore password
    required: true
  ANDROID_ALIAS:
    description: Android keystore alias
    required: true
  ANDROID_ALIAS_PASS:
    description: Android keystore alias password
    required: true
  NPM_TOKEN:
    description: Token for private npm packages
    required: false
  SERVICE_ACCOUNT_JSON:
    description: Google Play service account JSON — enables Play Store deployment
    required: false
  track:
    description: Play Store release track (internal | alpha | beta | production)
    required: false
    default: internal
  changesNotSentForReview:
    description: Do not send changes for review on Play Store
    required: false
    default: 'false'
  nodeVersion:
    description: Node.js version
    required: false
    default: "18"
  javaVersion:
    description: Java version
    required: false
    default: "21"
  javaDistribution:
    description: Java distribution (temurin | adopt | zulu | ...)
    required: false
    default: "temurin"
  useNPM:
    description: Use NPM instead of Yarn
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    - name: Setup Node ${{ inputs.nodeVersion }}
      uses: actions/setup-node@v4
      with:
        registry-url: 'https://registry.npmjs.org/'
        node-version: ${{ inputs.nodeVersion }}
        cache: ${{ inputs.useNPM == 'true' && 'npm' || 'yarn' }}

    - name: Setup Java ${{ inputs.javaVersion }}
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.javaDistribution }}
        java-version: ${{ inputs.javaVersion }}

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Decode keystore
      id: decode_keystore
      uses: timheuer/base64-to-file@v1
      with:
        fileName: "release.keystore"
        encodedString: ${{ inputs.KEYSTORE64 }}

    - name: Copy keystore
      shell: bash
      run: cp ${{ steps.decode_keystore.outputs.filePath }} ./android/app

    - name: Install dependencies with Yarn
      shell: bash
      if: inputs.useNPM == 'false'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}
      run: yarn install --frozen-lockfile

    - name: Install dependencies with NPM
      shell: bash
      if: inputs.useNPM == 'true'
      env:
        NODE_AUTH_TOKEN: ${{ inputs.NPM_TOKEN }}
      run: npm ci

    - name: Get version from package.json
      id: package-version
      uses: martinbeentjes/npm-get-version-action@v1.3.1

    - name: Update build.gradle version
      uses: damienaicheh/update-android-version-gradle-action@v1.0.0
      with:
        build-gradle-path: "./android/app/build.gradle"
        version-code: ${{ github.run_number }}
        version-name: ${{ steps.package-version.outputs.current-version }}
        print-file: true

    - name: Build Release 🔨
      shell: bash
      id: build_release
      run: cd android && ./gradlew bundleRelease
      env:
        SIGNING_STORE_PASSWORD: ${{ inputs.ANDROID_KEY_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ inputs.ANDROID_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ inputs.ANDROID_ALIAS_PASS }}

    - name: Upload Artifact
      if: inputs.SERVICE_ACCOUNT_JSON == ''
      uses: actions/upload-artifact@v4
      with:
        name: app-release.aab
        path: ./android/app/build/outputs/bundle/release

    - name: Write service account JSON
      shell: bash
      if: inputs.SERVICE_ACCOUNT_JSON != ''
      run: echo '${{ inputs.SERVICE_ACCOUNT_JSON }}' > service_account.json

    - name: Deploy to Play Store 🚀
      if: inputs.SERVICE_ACCOUNT_JSON != ''
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJson: service_account.json
        packageName: ${{ inputs.package-name }}
        releaseFiles: ./android/app/build/outputs/bundle/release/app-release.aab
        track: ${{ inputs.track }}
        changesNotSentForReview: ${{ inputs.changesNotSentForReview }}
